packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'control-plane'
  - 'saare-console'
  - 'saare-suite'
  - 'controls'

# Permisos de ejecución de scripts de construcción para dependencias nativas
allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  workerd: true

# Exclusiones de la política de antigüedad de liberaciones
minimumReleaseAgeExclude:
  - 'lucide-react@1.56.0'
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
