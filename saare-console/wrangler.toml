name = "saare-console"
compatibility_date = "2026-09-27"

# Configuración de compilación para SPA (Vite / React)
[build]
command = "npm run build"
output_dir = "dist"

# Variables de entorno públicas inyectadas en tiempo de cliente (Vite)
[vars]
VITE_CONTROL_PLANE_URL = "https://api.saare.es"

# Enrutamiento SPA (Redirecciona cualquier ruta interna al index.html de dist)
[[routes]]
pattern = "*saare.es/*"
script = "index.html"