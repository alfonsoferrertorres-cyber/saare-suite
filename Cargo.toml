[workspace]
resolver = "2"
members = [
    "core",
    "tools/saare-licgen",
    "tools/saare-runtime",
    "modules/01_perimetershield",
    "modules/02_evidencevault"
]

[workspace.dependencies]
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
tokio = "1.38"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
