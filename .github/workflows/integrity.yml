name: SAARE Pipeline Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-saare:
    name: Validate Build & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build SAARE Suite
        working-directory: saare-suite
        run: |
          npm install
          npm run build

      - name: Build SAARE Console
        working-directory: saare-console
        run: |
          npm install
          npm run build