name: SAARE Pipeline Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-saare:
    name: Validate Monorepo Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inspect Workspace and Build Modules
        run: |
          echo "=== Estructura del repositorio en runner ==="
          ls -la
          
          if [ -d "saare-suite" ]; then
            echo "--> Compilando saare-suite..."
            cd saare-suite
            npm install
            npm run build
            cd ..
          fi

          if [ -d "saare-console" ]; then
            echo "--> Compilando saare-console..."
            cd saare-console
            npm install
            npm run build
            cd ..
          fi
          
          echo "=== Monorepo validado con éxito ==="