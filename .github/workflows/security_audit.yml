name: S.A.A.R.E. Compliance & Security Audit Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    name: Cryptographic & Integrity Suite Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache Setup
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify Workspace Compilation
        run: cargo check --workspace

      - name: Run Cryptographic & E2E Unit Tests
        run: cargo test --workspace --all-targets

      - name: Build Hardened Release Binary
        run: cargo build --release --workspace

      - name: Execute Zero-Disk Runtime Hardening Test
        run: cargo run --release -p saare-runtime
