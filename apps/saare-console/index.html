<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="S.A.A.R.E. Platform — Consola de Auditoría Ex-Ante, Bóveda Dual L7 e Infraestructura Soberana de Gobierno de IA." />
    
    <!-- BRANDING E ICONOS DE NAVEGACIÓN -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>S.A.A.R.E. Platform | Dual-Vault L7 & Audit Console</title>

    <!-- BOOTSTRAP DE ESTADO DE SESIÓN Y COMPATIBILIDAD CON API.JS / APP.JSX -->
    <script>
      (function() {
        try {
          const storedEmail = localStorage.getItem('saare_user_email');
          const storedRole = localStorage.getItem('saare_user_role') || 'CISO_ADMIN';
          const storedTenant = localStorage.getItem('saare_tenant_domain') || localStorage.getItem('saare_tenant_id') || 'ORGANISMO_DEMO_01';

          // Homologación de claves de almacenamiento local para api.js y saareState.js
          if (!localStorage.getItem('saare_tenant_domain') && storedTenant) {
            localStorage.setItem('saare_tenant_domain', storedTenant);
          }
          if (!localStorage.getItem('saare_session_user') && storedEmail) {
            localStorage.setItem('saare_session_user', JSON.stringify({
              email: storedEmail,
              role: storedRole,
              tenantName: storedTenant
            }));
          }
        } catch (e) {
          console.warn('[SAARE_INIT] Error sincronizando estado inicial de localStorage:', e);
        }
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #030712; color: #f8fafc;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
