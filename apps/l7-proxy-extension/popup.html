<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background-color: #0f172a; color: #f8fafc; }
    h2 { font-size: 14px; margin-top: 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; margin-bottom: 4px; color: #94a3b8; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 4px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:hover { background: #0369a1; }
    .status { font-size: 11px; margin-top: 10px; text-align: center; color: #22c55e; }
  </style>
</head>
<body>
  <h2>S.A.A.R.E. Node Connector</h2>
  
  <div class="field">
    <label for="tenantId">ID del Tenant / Empresa:</label>
    <input type="text" id="tenantId" placeholder="ORGANISMO_DEMO_01">
  </div>

  <div class="field">
    <label for="apiUrl">URL del Control Plane API:</label>
    <input type="text" id="apiUrl" value="https://api.saare.es">
  </div>

  <div class="field">
    <label for="authToken">JWT / Token Pasarela (Opcional):</label>
    <input type="password" id="authToken" placeholder="Token OIDC/Bearer">
  </div>

  <button id="saveBtn">VINCULAR NODO L7</button>
  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
