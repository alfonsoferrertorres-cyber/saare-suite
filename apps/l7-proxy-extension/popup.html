<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>S.A.A.R.E. L7 Interceptor</title>
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 16px; box-sizing: border-box; }
    h2 { font-size: 0.9rem; margin-top: 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; background: #020617; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 0.8rem; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #fff; border: none; border-radius: 6px; font-weight: 900; font-size: 0.8rem; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    button:hover { opacity: 0.95; }
    #status { margin-top: 10px; font-size: 0.72rem; text-align: center; color: #34d399; font-weight: 800; }
  </style>
</head>
<body>
  <h2>S.A.A.R.E. Nodo L7 Config</h2>
  <div class="field">
    <label>API Gateway Endpoint</label>
    <input type="text" id="apiUrl" value="https://api.saare.es" />
  </div>
  <div class="field">
    <label>Organismo / Tenant</label>
    <input type="text" id="tenant" value="ORGANISMO_DEMO_01" />
  </div>
  <div class="field">
    <label>Operador / Usuario</label>
    <input type="text" id="user" value="operador@empresa.com" />
  </div>
  <button id="saveBtn">Vincular Nodo L7</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
