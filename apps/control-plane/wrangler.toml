name = "saare-control-plane-prod"
main = "worker.js"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.saare.es", custom_domain = true }
]

[vars]
AUTHOR_NAME = "Alfonso Ferrer Torres"
SAFE_CREATIVE_ID = "2607076315021"
AUDIT_TOKEN = "IA-2026-VAL-AUD-8842-XF"
P2026_REGISTRATION = "P202630603"
EXPEDIENTE_ID = "MS3V-SGP1.0-MASTER-2026"
SGP_SPEC_VERSION = "SGP 1.0"
WORKER_NAME = "saare-control-plane-prod"
TRUST_ANCHOR = "https://vault.saare.es"
PUBLIC_API_URL = "https://api.saare.es/api/v1/proxy/llm"
CPAAS_DEFAULT_PROVIDER = "twilio"
TWILIO_FROM_NUMBER = "+1234567890"
INFOBIP_BASE_URL = "https://api.infobip.com"

[[d1_databases]]
binding = "DB"
database_name = "saare-vault-d1"
database_id = "27eedbe9-1e30-4e11-bd26-220c049f264a"

[[kv_namespaces]]
binding = "SAARE_VAULT_KV"
id = "8dbfe21019834fc1bdefd9b66e4e810b"

[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "saare_tenant_usage"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = ["0 */6 * * *"]