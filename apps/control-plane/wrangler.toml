name = "saare-control-plane"
main = "worker.js"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Configurar dominio personalizado por cliente/entorno:
# routes = [
#   { pattern = "api.ejemplo-cliente.com", custom_domain = true }
# ]

[vars]
AUTHOR_NAME = "S.A.A.R.E. Enterprise Control Plane"
ADMIN_EMAIL = ""
ALLOW_FALLBACK_VAULT = "false"
CHROME_EXTENSION_ID = ""
SAFE_CREATIVE_TSA_HASH = ""
SAFE_CREATIVE_CORE_ID = ""
SAFE_CREATIVE_DICTAMEN_ID = ""
SAFE_CREATIVE_ID = ""
AUDIT_TOKEN = ""
P2026_REGISTRATION = ""
EXPEDIENTE_ID = ""
SGP_SPEC_VERSION = "SGP 1.0"
WORKER_NAME = "saare-control-plane"
TRUST_ANCHOR = ""
PUBLIC_API_URL = ""
CPAAS_DEFAULT_PROVIDER = "twilio"
TWILIO_FROM_NUMBER = ""
INFOBIP_BASE_URL = "https://api.infobip.com"

# [[d1_databases]]
# binding = "DB"
# database_name = "saare-vault-d1"
# database_id = "REPLACE_WITH_CLIENT_D1_ID"

# [[kv_namespaces]]
# binding = "SAARE_VAULT_KV"
# id = "REPLACE_WITH_CLIENT_KV_ID"

# [[analytics_engine_datasets]]
# binding = "USAGE_ANALYTICS"
# dataset = "saare_tenant_usage"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = ["0 */6 * * *"]