apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saare-control-plane-ingress
  namespace: saare-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.saare.es
    secretName: tls-api-saare
  rules:
  - host: api.saare.es
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saare-control-plane-service
            port:
              number: 80