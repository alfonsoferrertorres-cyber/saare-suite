<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 16px;
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .title {
      font-weight: 900;
      font-size: 13px;
      color: #ffffff;
      letter-spacing: 0.8px;
    }
    .badge-status {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid #22c55e;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 9.5px;
      font-weight: bold;
    }
    .info-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .label {
      color: #9ca3af;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 700;
    }
    .val {
      color: #38bdf8;
      font-family: monospace;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .btn-console {
      display: block;
      width: 100%;
      text-align: center;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 9px 0;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11.5px;
      box-sizing: border-box;
      transition: background 0.2s ease;
    }
    .btn-console:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/logo_saare.png" alt="SAARE" class="brand-logo" />
      <span class="title">SAARE SENSOR L7</span>
    </div>
    <span class="badge-status">● ACTIVO</span>
  </div>

  <div class="info-card">
    <div class="label">Organización / Tenant</div>
    <div class="val" id="disp-tenant">Consultando...</div>

    <div class="label">Usuario / Testigo Operador</div>
    <div class="val" id="disp-user">Consultando...</div>

    <div class="label">Protocolo de Custodia</div>
    <div class="val" style="color: #4ade80;">SGP 1.0 (Fail-Closed)</div>

    <div class="label">Procesamiento RAM</div>
    <div class="val" style="color: #ca8a04; margin: 0;">Ephemeral Zero-Disk Persistence</div>
  </div>

  <a href="https://console.saare.es" target="_blank" class="btn-console" id="btn-link">
    Abrir SAARE GRC Console ↗
  </a>

  <script>
    function updateDisplay(user, tenant, token) {
      const finalUser = user || 'auditor@tenant.local';
      const finalTenant = tenant || (finalUser.includes('@') ? finalUser.split('@')[1].split('.')[0].toUpperCase() : 'ORGANIZACION_AUDITADA');
      
      document.getElementById('disp-user').innerText = finalUser;
      document.getElementById('disp-tenant').innerText = finalTenant;

      if (token) {
        document.getElementById('btn-link').href = `https://console.saare.es/?user=${encodeURIComponent(finalUser)}&token=${encodeURIComponent(token)}&tenant=${encodeURIComponent(finalTenant)}&status=ACTIVE`;
      }
    }

    // 1. Intento de lectura de credenciales gestionadas por MDM/GPO
    if (typeof chrome !== "undefined" && chrome.storage?.managed) {
      chrome.storage.managed.get(['saare_user_email', 'saare_tenant_domain', 'saare_bootstrap_token'], (managed) => {
        if (managed?.saare_user_email) {
          updateDisplay(managed.saare_user_email, managed.saare_tenant_domain, managed.saare_bootstrap_token);
        } else {
          fallbackLocal();
        }
      });
    } else {
      fallbackLocal();
    }

    // 2. Fallback a almacenamiento local de la extensión
    function fallbackLocal() {
      if (typeof chrome !== "undefined" && chrome.storage?.local) {
        chrome.storage.local.get(['saare_user_email', 'saare_tenant_domain', 'saare_bootstrap_token', 'saareUser', 'saareTenant'], (res) => {
          const user = res.saare_user_email || res.saareUser;
          const tenant = res.saare_tenant_domain || res.saareTenant;
          const token = res.saare_bootstrap_token;
          updateDisplay(user, tenant, token);
        });
      } else {
        updateDisplay(null, null, null);
      }
    }
  </script>
</body>
</html>
