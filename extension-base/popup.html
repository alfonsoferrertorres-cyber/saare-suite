<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>S.A.A.R.E. L7 Agent Witness</title>
  <style>
    body {
      width: 330px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #030712;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      font-weight: 900;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }
    h3 {
      margin: 0;
      color: #38bdf8;
      font-size: 13px;
      letter-spacing: 0.5px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .status.connected {
      background-color: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status.disconnected {
      background-color: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status.checking {
      background-color: #0f172a;
      color: #94a3b8;
      border: 1px solid #1e293b;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 11.5px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .row strong {
      color: #f1f5f9;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }
    .form-group {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
    }
    input {
      background: #020617;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 7px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-vault {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      margin-top: 8px;
    }
    .btn-vault:hover {
      background: rgba(56, 189, 248, 0.2);
    }
    .footer {
      font-size: 10px;
      color: #475569;
      line-height: 1.4;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">🛡️</div>
      <div>
        <h3>S.A.A.R.E. L7</h3>
        <span style="font-size: 9px; color: #64748b;">Sovereign Witness v8.2</span>
      </div>
    </div>
  </div>

  <div id="status-indicator" class="status checking">⏳ COMPROBANDO ENLACE...</div>

  <div class="card">
    <div class="row">
      <span>Organización:</span>
      <strong id="tenant-name">Cargando...</strong>
    </div>
    <div class="row">
      <span>Identidad:</span>
      <strong id="user-account" style="color: #38bdf8;">Cargando...</strong>
    </div>
    <div class="row">
      <span>Rol de Acceso:</span>
      <strong id="user-role" style="color: #34d399;">CISO_ADMIN</strong>
    </div>

    <div class="form-group">
      <label for="token-input">Token de Sesión / Credencial Vault:</label>
      <input type="password" id="token-input" placeholder="sk_saare_live_..." />
    </div>

    <button id="save-credentials-btn" class="btn btn-primary">
      💾 Sincronizar Credenciales
    </button>
  </div>

  <button id="open-vault-btn" class="btn btn-vault">
    🔗 Abrir Bóveda en Consola GRC
  </button>

  <div class="footer">
    Protección Ex-Ante en tiempo real. Zero-Persistence RAM Mode.
  </div>

  <script src="popup.js"></script>
</body>
</html>
