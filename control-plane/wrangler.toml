# wrangler.toml — Configuración Oficial S.A.A.R.E. Control Plane

name = "saare-control-plane-prod"
main = "worker.js"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

# Enrutamiento de Dominios Oficiales (Custom Domains)
routes = [
  { pattern = "api.saare.es", custom_domain = true },
  { pattern = "vault.saare.es", custom_domain = true }
]

# Automatización de Tareas Programadas
[triggers]
crons = ["0 */6 * * *"]

# Configuración de Observabilidad
[observability]
enabled = true
head_sampling_rate = 1.0

# ------------------------------------------------------------------------------
# VARIABLES Y BINDINGS GLOBALES
# ------------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
WORKER_NAME = "saare-core-l7-isv"
SGP_SPEC_VERSION = "SGP 1.0"
EXPEDIENTE_MASTER = "MS3V-RECON-VALID-2026-ALF-0521"
ALLOW_FALLBACK_VAULT = "false"
TRUST_ANCHOR = "https://vault.saare.es"
SAFE_CREATIVE_ID = "RPI-2607076315021"

# Bóveda KV Global
[[kv_namespaces]]
binding = "SAARE_VAULT_KV"
id = "8dbfe21019834fc1bdefd9b66e4e810b"

# Bóveda D1 SQL
[[d1_databases]]
binding = "DB"
database_name = "saare-vault-d1"
database_id = "27eedbe9-1e30-4e11-bd26-220c049f264a"

# ------------------------------------------------------------------------------
# ENTORNO DE PRODUCCIÓN EXPLÍCITO (Soluciona el aviso de Wrangler)
# ------------------------------------------------------------------------------
[env.production]
name = "saare-control-plane-prod"