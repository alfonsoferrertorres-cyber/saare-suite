name = "saare-control-plane-prod"
main = "worker.js"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

# Enrutamiento de Dominios Oficiales
routes = [
  { pattern = "api.saare.es/*", zone_name = "saare.es" },
  { pattern = "saare.es/api/*", zone_name = "saare.es" },
  { pattern = "saare.es/v1/*", zone_name = "saare.es" }
]

# Bóveda KV Global
[[kv_namespaces]]
binding = "SAARE_VAULT_KV"
id = "8dbfe21019834fc1bdefd9b66e4e810b"

# Entorno de Producción
[env.production]
name = "saare-control-plane-prod"

[env.production.vars]
ENVIRONMENT = "production"
WORKER_NAME = "saare-core-l7-isv"
SGP_SPEC_VERSION = "SGP 1.0"
EXPEDIENTE_MASTER = "MS3V-RECON-VALID-2026-ALF-0521"
TITULAR_NIF = "Alfonso Ferrer Torres (48553065L)"
ALLOW_FALLBACK_VAULT = "false"

[[env.production.kv_namespaces]]
binding = "SAARE_VAULT_KV"
id = "8dbfe21019834fc1bdefd9b66e4e810b"