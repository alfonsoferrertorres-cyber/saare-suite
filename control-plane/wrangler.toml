name = "control-plane"
main = "worker.js"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.saare.es", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
SENDER_EMAIL = "legal@saare.es"
APP_URL = "https://console.saare.es"
ALLOW_FALLBACK_VAULT = "true"

[[kv_namespaces]]
binding = "SAARE_VAULT_KV"
id = "8dbfe21019834fc1bdefd9b66e4e810b"

[[d1_databases]]
binding = "DB"
database_name = "saare-db"
database_id = "85108385-a75a-4764-a9e8-973bfb83d899"