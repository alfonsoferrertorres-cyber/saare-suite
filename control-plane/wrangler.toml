# wrangler.toml — Configuración Oficial S.A.A.R.E. Control Plane (Producción)

name = "saare-control-plane-prod"
main = "worker.js"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.saare.es", custom_domain = true },
  { pattern = "vault.saare.es", custom_domain = true }
]

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true
head_sampling_rate = 1.0

# ------------------------------------------------------------------------------
# VARIABLES Y BINDINGS GLOBALES (Trazabilidad Dual, Ex-Ante & Stripe SGP 1.0)
# ------------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
WORKER_NAME = "saare-core-l7-isv"
SGP_SPEC_VERSION = "SGP 1.0"
EXPEDIENTE_MASTER = "MS3V-RECON-VALID-2026-ALF-0521"
EXPEDIENTE_AUDIT = "IA-2026-VAL-AUD-8842-XF"
ALLOW_FALLBACK_VAULT = "false"
TRUST_ANCHOR = "https://vault.saare.es"
SAFE_CREATIVE_ID = "RPI-2607076315021"
LLM_MILESTONE_RPI = "RPI-2026-SAARE-0914X"

# Stripe SGP 1.0 Payment Links Públicos (Checkout Redirection)
STRIPE_LINK_COMPLIANCE_MONTHLY = "https://buy.stripe.com/afA4gza217ydegzagd8g006"
STRIPE_LINK_COMPLIANCE_YEARLY  = "https://buy.stripe.com/fZu14n8XX5q5c8r9c98g008"
STRIPE_LINK_PRO_MONTHLY        = "https://buy.stripe.com/fZu5kD0rr5q5egz0FD8g007"
STRIPE_LINK_PRO_YEARLY         = "https://buy.stripe.com/bJe14n8XX4m18Wf5ZX8g009"

[[kv_namespaces]]
binding = "SAARE_VAULT_KV"
id = "8dbfe21019834fc1bdefd9b66e4e810b"

[[d1_databases]]
binding = "DB"
database_name = "saare-vault-d1"
database_id = "27eedbe9-1e30-4e11-bd26-220c049f264a"

# ------------------------------------------------------------------------------
# ENTORNO DE PRODUCCIÓN EXPLÍCITO (Paridad de variables y bindings)
# ------------------------------------------------------------------------------
[env.production]
name = "saare-control-plane-prod"
routes = [
  { pattern = "api.saare.es", custom_domain = true },
  { pattern = "vault.saare.es", custom_domain = true }
]

[env.production.vars]
