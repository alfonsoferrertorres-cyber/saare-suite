name = "control-plane"
main = "worker.js"
compatibility_date = "2026-09-25"
compatibility_flags = [ "nodejs_compat" ]

[vars]
ENVIRONMENT = "production"
SAARE_SPEC = "SGP-1.0"
SAFE_CREATIVE_BASE_URL = "https://api.safecreative.org/v2"

[[d1_databases]]
binding = "DB"
database_name = "saare-db"
database_id = "85108385-a75a-4764-a9e8-973bfb83d899"

[[kv_namespaces]]
binding = "SAARE_VAULT_KV"
id = "8dbfe21019834fc1bdefd9b66e4e810b"

[observability]
enabled = true