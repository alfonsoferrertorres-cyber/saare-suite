<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #030712;
      color: #ffffff;
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header-badge {
      background: #0284c7;
      color: #ffffff;
      font-weight: 900;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    h3 {
      margin: 0;
      color: #ffffff;
      font-size: 13.5px;
      letter-spacing: 0.5px;
      font-weight: 800;
    }
    .status {
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
      font-family: monospace;
    }
    .status.connected {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .status.disconnected {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid #ef4444;
    }
    .status.checking {
      background-color: #111827;
      color: #94a3b8;
      border: 1px solid #374151;
    }
    .card {
      background: #0b0f19;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 11.5px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #9ca3af;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .row strong {
      color: #e2e8f0;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      line-height: 1.4;
      text-align: center;
      border-top: 1px dashed #1f2937;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-badge">S</div>
    <h3>SAARE EXECUTION GUARD</h3>
  </div>

  <div id="status-indicator" class="status checking">⏳ COMPROBANDO ENLACE JUDGE...</div>

  <div class="card">
    <div class="row">
      <span>Tenant:</span>
      <strong id="tenant-name">Cargando...</strong>
    </div>
    <div class="row">
      <span>Identidad:</span>
      <strong id="user-account" style="color: #38bdf8;">Cargando...</strong>
    </div>
    <div class="row">
      <span>Inspección:</span>
      <strong style="color: #34d399;">Ephemeral Runtime (L7)</strong>
    </div>
    <div class="row" style="margin-top: 6px; border-top: 1px solid #1f2937; padding-top: 6px;">
      <span>Actividad:</span>
      <strong id="verdict-stats" style="color: #f59e0b; font-family: monospace;">0 evaluadas</strong>
    </div>
  </div>

  <div class="footer">
    SAARE AI Execution Authorization Infrastructure (SGP 1.0)<br>
    Frontera activa sobre Gemini, ChatGPT, Claude y DeepSeek.
  </div>

  <script src="popup.js"></script>
</body>
</html>
