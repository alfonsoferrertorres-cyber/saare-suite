name = "saare-api-gateway"
main = "src/worker.js" # O la ruta de entrada a tu Worker
compatibility_date = "2026-09-01"

# 1. Variables de entorno públicas (Accesibles desde env.VARIABLE)
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://saare.es"
STRIPE_SUCCESS_URL = "https://saare.es/producto/cumplimiento?session_id={CHECKOUT_SESSION_ID}"
STRIPE_CANCEL_URL = "https://saare.es/#licencias"

# 2. Vinculación con la base de datos D1 (Reemplaza con tu database_id real)
[[d1_databases]]
binding = "DB" # Accesible en el Worker como env.DB
database_name = "saare-db"
database_id = "85108385-a75a-4764-a9e8-973bfb83d899"

# 3. Almacenamiento KV para cachés de políticas o sesiones (Opcional)
# [[kv_namespaces]]
# binding = "SAARE_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
