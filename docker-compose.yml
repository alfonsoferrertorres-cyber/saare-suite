version: '3.8'

services:
  saare-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  saare-frontend:
    build:
      context: ./saare-console
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - saare-backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000