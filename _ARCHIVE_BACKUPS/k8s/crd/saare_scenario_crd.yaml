apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: saarescenarios.saare.io
spec:
  group: saare.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                scenarioId:
                  type: string
                hsmEnabled:
                  type: boolean
                l7FilterPolicy:
                  type: string
  scope: Namespaced
  names:
    plural: saarescenarios
    singular: saarescenario
    kind: SaareScenario
    shortNames:
      - ss
