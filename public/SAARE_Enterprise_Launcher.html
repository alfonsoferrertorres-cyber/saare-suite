<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.A.R.E. v4.2 - Enterprise Launcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #020617;
            --bg-panel: #0f172a;
            --border-glass: rgba(255, 255, 255, 0.08);
            
            /* Vertical Colors (Glows) */
            --glow-devops: #fbbf24;   /* Ámbar */
            --glow-banca: #10b981;    /* Esmeralda */
            --glow-grc: #06b6d4;      /* Cian */
            --glow-ciber: #a855f7;    /* Púrpura */
            --glow-defensa: #94a3b8;  /* Acero */
            --glow-educacion: #6366f1;/* Índigo */
            --glow-identidad: #14b8a6;/* Turquesa */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-obsidian);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255,255,255,0.02) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255,255,255,0.02) 0%, transparent 50%);
        }

        /* Sidebar Launcher */
        .sidebar {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-glass);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 1rem;
        }

        .brand-logo span {
            color: var(--glow-grc);
            font-size: 1rem;
            vertical-align: top;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            border-color: var(--border-glass);
        }

        /* Color dots for categories */
        .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
        .nav-item[data-filter="devops"] .dot { color: var(--glow-devops); background: var(--glow-devops); }
        .nav-item[data-filter="banca"] .dot { color: var(--glow-banca); background: var(--glow-banca); }
        .nav-item[data-filter="grc"] .dot { color: var(--glow-grc); background: var(--glow-grc); }
        .nav-item[data-filter="ciber"] .dot { color: var(--glow-ciber); background: var(--glow-ciber); }
        .nav-item[data-filter="defensa"] .dot { color: var(--glow-defensa); background: var(--glow-defensa); }
        .nav-item[data-filter="educacion"] .dot { color: var(--glow-educacion); background: var(--glow-educacion); }
        .nav-item[data-filter="identidad"] .dot { color: var(--glow-identidad); background: var(--glow-identidad); }
        .nav-item[data-filter="all"] .dot { color: #ffffff; background: #ffffff; }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2.5rem;
            height: 100vh;
            overflow-y: auto;
        }

        .header-section {
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            color: #64748b;
            font-size: 1rem;
        }

        .btn-discovery {
            background: #06b6d4;
            color: #020617;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-discovery:hover {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }

        /* CSS Grid for Solutions */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Cyber-Industrial Card */
        .card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px transparent;
            transition: all 0.4s ease;
            z-index: 2;
            pointer-events: none;
        }

        /* Glow Effects on Hover */
        .card[data-category="devops"]:hover { border-color: var(--glow-devops); box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.3); }
        .card[data-category="banca"]:hover { border-color: var(--glow-banca); box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.3); }
        .card[data-category="grc"]:hover { border-color: var(--glow-grc); box-shadow: 0 10px 30px -10px rgba(6, 182, 212, 0.3); }
        .card[data-category="ciber"]:hover { border-color: var(--glow-ciber); box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.3); }
        .card[data-category="defensa"]:hover { border-color: var(--glow-defensa); box-shadow: 0 10px 30px -10px rgba(148, 163, 184, 0.3); }
        .card[data-category="educacion"]:hover { border-color: var(--glow-educacion); box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.3); }
        .card[data-category="identidad"]:hover { border-color: var(--glow-identidad); box-shadow: 0 10px 30px -10px rgba(20, 184, 166, 0.3); }

        .card:hover .card-bg {
            transform: scale(1.05);
        }

        .card-bg {
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            background-image: url('watermarked_img_17171974852090795231.png');
            background-size: 700% 450%; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
            filter: contrast(1.1) brightness(0.9);
        }

        .card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(2, 6, 23, 1) 0%, rgba(2, 6, 23, 0.8) 30%, rgba(2, 6, 23, 0.1) 100%);
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 3;
            padding: 1.5rem;
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }

        .card:hover .card-content {
            transform: translateY(0);
        }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.25rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .card-meta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card[data-category="devops"] .card-meta { color: var(--glow-devops); }
        .card[data-category="banca"] .card-meta { color: var(--glow-banca); }
        .card[data-category="grc"] .card-meta { color: var(--glow-grc); }
        .card[data-category="ciber"] .card-meta { color: var(--glow-ciber); }
        .card[data-category="defensa"] .card-meta { color: var(--glow-defensa); }
        .card[data-category="educacion"] .card-meta { color: var(--glow-educacion); }
        .card[data-category="identidad"] .card-meta { color: var(--glow-identidad); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-obsidian); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand-logo">S.A.A.R.E.<span>v4.2</span></div>
        <nav class="nav-menu">
            <div class="nav-item active" data-filter="all"><div class="dot"></div> Módulo Central</div>
            <div class="nav-item" data-filter="devops"><div class="dot"></div> DevOps & FinOps</div>
            <div class="nav-item" data-filter="banca"><div class="dot"></div> Banca & FinTech</div>
            <div class="nav-item" data-filter="grc"><div class="dot"></div> GRC, Legal & Salud</div>
            <div class="nav-item" data-filter="ciber"><div class="dot"></div> Ciberseguridad</div>
            <div class="nav-item" data-filter="defensa"><div class="dot"></div> Defensa & IoT</div>
            <div class="nav-item" data-filter="educacion"><div class="dot"></div> Educación & STEM</div>
            <div class="nav-item" data-filter="identidad"><div class="dot"></div> Identidad & IP</div>
        </nav>
    </aside>

    <!-- MAIN LAUNCHER AREA -->
    <main class="main-content">
        <div class="header-section">
            <div>
                <h1 class="header-title">Despliegue de Infraestructura</h1>
                <p class="header-subtitle">Seleccione la topología de red y los escudos modulares a inicializar.</p>
            </div>
            <button class="btn-discovery" id="btn-open-discovery">REQUEST DISCOVERY ACCESS</button>
        </div>

        <div class="grid-container" id="module-grid"></div>
    </main>

    <!-- Inyección de Lógica Frontend & Eventos -->
    <script src="/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modules = [
                // DevOps
                { title: 'Optimizador API', cat: 'devops', meta: 'DVO-01', x: 0, y: 0 },
                { title: 'Freno de Emergencia', cat: 'devops', meta: 'DVO-02', x: 0, y: 33 },
                { title: 'Erradicador RAG', cat: 'devops', meta: 'DVO-03', x: 0, y: 66 },
                { title: 'Selector Inteligente', cat: 'devops', meta: 'DVO-04', x: 0, y: 100 },
                
                // Banca
                { title: 'Escudo Bancario', cat: 'banca', meta: 'BNC-01', x: 16.6, y: 0 },
                { title: 'Conmutador Multi-LLM', cat: 'banca', meta: 'BNC-02', x: 16.6, y: 50 },
                
                // GRC
                { title: 'Blindaje Clínico', cat: 'grc', meta: 'GRC-01', x: 33.3, y: 0 },
                { title: 'Auditor EU AI Act', cat: 'grc', meta: 'GRC-02', x: 33.3, y: 50 },
                { title: 'Extractor ISO 42001', cat: 'grc', meta: 'GRC-03', x: 33.3, y: 100 },
                
                // Ciber
                { title: 'Defensa Anti-Jailbreak', cat: 'ciber', meta: 'CYB-01', x: 50, y: 0 },
                { title: 'Notario para Tribunales', cat: 'ciber', meta: 'CYB-02', x: 50, y: 50 },
                { title: 'Sellador de Brechas SOC', cat: 'ciber', meta: 'CYB-03', x: 50, y: 100 },

                // Defensa
                { title: 'Búnker Air-Gapped', cat: 'defensa', meta: 'DEF-01', x: 66.6, y: 0 },
                { title: 'Gobernanza Edge/IoT', cat: 'defensa', meta: 'DEF-02', x: 66.6, y: 50 },

                // Educacion
                { title: 'Tutor COPPA', cat: 'educacion', meta: 'EDU-01', x: 83.3, y: 0 },
                { title: 'Validador STEM', cat: 'educacion', meta: 'EDU-02', x: 83.3, y: 50 },

                // Identidad
                { title: 'KYC Antifraude', cat: 'identidad', meta: 'ID-01', x: 100, y: 0 },
                { title: 'Certificación C2PA', cat: 'identidad', meta: 'ID-02', x: 100, y: 25 },
                { title: 'Radar Anti-Clonación', cat: 'identidad', meta: 'ID-03', x: 100, y: 50 },
                { title: 'Trazabilidad de Derechos', cat: 'identidad', meta: 'ID-04', x: 100, y: 75 },
                { title: 'Escudo Opt-Out Scraping', cat: 'identidad', meta: 'ID-05', x: 100, y: 100 }
            ];

            const grid = document.getElementById('module-grid');

            // Renderizado seguro en el DOM
            modules.forEach(mod => {
                const bgPos = `${mod.x}% ${mod.y}%`;
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-category', mod.cat);
                card.innerHTML = `
                    <div class="card-bg" style="background-position: ${bgPos};"></div>
                    <div class="card-overlay"></div>
                    <div class="card-content">
                        <div class="card-meta">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                            ${mod.meta} - SYS.RDY
                        </div>
                        <h3 class="card-title">${mod.title}</h3>
                    </div>
                `;

                // Clic en tarjeta -> Disparar formulario de Discovery
                card.addEventListener('click', () => {
                    const btnDiscovery = document.getElementById('btn-open-discovery');
                    if (btnDiscovery) btnDiscovery.click();
                });

                grid.appendChild(card);
            });

            // Filtrado de navegación
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');

                    const filter = item.getAttribute('data-filter');
                    const cards = document.querySelectorAll('.card');
                    cards.forEach(card => {
                        if (filter === 'all' || card.getAttribute('data-category') === filter) {
                            card.classList.remove('hidden');
                        } else {
                            card.classList.add('hidden');
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
